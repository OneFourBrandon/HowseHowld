<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f8f5;color:#1d2925;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <p style="margin:0 0 18px;color:#367c65;font-size:13px;font-weight:700;letter-spacing:.08em">
        HOWSEHOWLD
      </p>
      <h1 style="margin:0 0 14px;font-size:28px">Your sign-in code</h1>
      <p style="margin:0 0 24px;color:#64716b;line-height:1.6">
        Enter this six-digit code in HowseHowld. It expires shortly and can
        only be used once.
      </p>
      <div style="padding:18px;background:#edf1e9;border-left:4px solid #c79535;font-size:32px;font-weight:800;letter-spacing:.18em">
        {{ .Token }}
      </div>
      <p style="margin:24px 0 0;color:#64716b;font-size:13px;line-height:1.5">
        If you did not request this code, you can ignore this email.
      </p>
    </div>
  </body>
</html>
