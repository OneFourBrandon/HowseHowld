name: howsehowld

services:
  app:
    container_name: howsehowld-app
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    init: true
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    # WebStorm should own the development server lifecycle. Do not let Docker
    # bring this container back after Docker Desktop or Windows restarts.
    restart: "no"

volumes:
  node_modules:
  pnpm_store:
